x-business-common: &business-common
  environment:
    - SPRING_PROFILES_ACTIVE=docker
    # Inherit AWS credentials from .env in the parent directory
    - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-dummy-bucket}
    - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-dummy-access-key}
    - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-dummy-secret-key}
    - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:-local-development-secret-change-me-123456789}
    - CATALOG_SERVICE_URL=${CATALOG_SERVICE_URL:-http://catalog-service:8081}
  networks:
    - bidmyhobby-network

services:
  # Local API Gateway (NGINX) - replacing Eureka and Spring Cloud Gateway
  api-gateway:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./services/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - bidmyhobby-network
    depends_on:
      - catalog-service
      - auction-service
      - frontend
      - hobby-ai-service
      # - payment-gateway-service
      # - social-interaction-service

  catalog-service:
    <<: *business-common
    build:
      context: ./services/catalog
      dockerfile: Dockerfile.local
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-dummy-bucket}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-dummy-access-key}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-dummy-secret-key}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-south-1}
      - AWS_LAMBDA_IMAGE_PROCESSOR=${AWS_LAMBDA_IMAGE_PROCESSOR:-bidmyhobby-image-processor}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:-local-development-secret-change-me-123456789}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-30}
    ports:
      - "8081:8081"
    volumes:
      - catalog-data:/app/data

  auction-service:
    <<: *business-common
    build:
      context: ./services/auction
      dockerfile: Dockerfile
    ports:
      - "8082:8082"

  hobby-ai-service:
    <<: *business-common
    build:
      context: ./services/hobby-ai
      dockerfile: Dockerfile
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-dummy-bucket}
      - AWS_S3_AI_BUCKET_NAME=bidmyhobby-ai-profiles
      - AWS_S3_AI_IMAGES_PREFIX=images/
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-dummy-access-key}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-dummy-secret-key}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET:-local-development-secret-change-me-123456789}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - APP_SITE_URL=${APP_SITE_URL:-http://localhost:3000}
      - AUTH_COOKIE_SECURE=false
    ports:
      - "8088:8088"
    volumes:
      - hobby-ai-data:/app/data

  # Next.js Frontend
  frontend:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    ports:
      - "3000:3000"
    networks:
      - bidmyhobby-network

networks:
  bidmyhobby-network:
    driver: bridge

volumes:
  catalog-data:
  hobby-ai-data:
