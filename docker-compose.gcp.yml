x-app-common: &app-common
  restart: unless-stopped
  networks:
    - bidmyhobby-network

x-java-healthcheck: &java-healthcheck
  interval: 20s
  timeout: 5s
  retries: 12
  start_period: 240s

services:
  # TLS terminates at Caddy; application routing remains in the existing NGINX gateway.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      - GCP_DOMAIN=${GCP_DOMAIN:?Set GCP_DOMAIN to a DNS name pointing at the VM}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deployment/gcp/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api-gateway
    networks:
      - bidmyhobby-network

  api-gateway:
    image: nginx:alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./services/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      catalog-service:
        condition: service_healthy
      auction-service:
        condition: service_healthy
      hobby-ai-service:
        condition: service_healthy
      image-processor:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - bidmyhobby-network

  image-processor:
    <<: *app-common
    image: ${IMAGE_BASE:?Set IMAGE_BASE}:${IMAGE_TAG:?Set IMAGE_TAG}-image-processor
    expose:
      - "8080"
    healthcheck:
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]

  catalog-service:
    <<: *app-common
    image: ${IMAGE_BASE:?Set IMAGE_BASE}:${IMAGE_TAG:?Set IMAGE_TAG}-catalog
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m
      IMAGE_PROCESSOR_URL: http://image-processor:8080/process
      GCP_STORAGE_BUCKET: ${GCP_STORAGE_BUCKET:-}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      AWS_LAMBDA_IMAGE_PROCESSOR: ${AWS_LAMBDA_IMAGE_PROCESSOR:-bidmyhobby-image-processor}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      CATALOG_SERVICE_URL: http://catalog-service:8081
    expose:
      - "8081"
    volumes:
      - catalog-data:/app/data
    entrypoint: ["java", "-XX:TieredStopAtLevel=1", "-jar", "app.jar"]
    depends_on:
      image-processor:
        condition: service_healthy
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]

  auction-service:
    <<: *app-common
    image: ${IMAGE_BASE:?Set IMAGE_BASE}:${IMAGE_TAG:?Set IMAGE_TAG}-auction
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m
      GCP_STORAGE_BUCKET: ${GCP_STORAGE_BUCKET:-}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET}
      CATALOG_SERVICE_URL: http://catalog-service:8081
    expose:
      - "8082"
    volumes:
      - auction-data:/app/data
    entrypoint: ["java", "-XX:TieredStopAtLevel=1", "-jar", "app.jar"]
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]

  hobby-ai-service:
    <<: *app-common
    image: ${IMAGE_BASE:?Set IMAGE_BASE}:${IMAGE_TAG:?Set IMAGE_TAG}-hobby-ai
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx768m
      GCP_STORAGE_BUCKET: ${GCP_STORAGE_BUCKET:-}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-}
      AWS_S3_AI_BUCKET_NAME: ${AWS_S3_AI_BUCKET_NAME:-bidmyhobby-ai-profiles}
      AWS_S3_AI_IMAGES_PREFIX: ${AWS_S3_AI_IMAGES_PREFIX:-images/}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-south-1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-+14155238886}
      SITE_URL: https://${GCP_DOMAIN:?Set GCP_DOMAIN}
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      APP_SITE_URL: https://${GCP_DOMAIN:?Set GCP_DOMAIN}
      AUTH_COOKIE_SECURE: "true"
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-false}
    expose:
      - "8088"
    volumes:
      - hobby-ai-data:/app/data
      - hobby-ai-images:/app/images
    entrypoint: ["java", "-XX:TieredStopAtLevel=1", "-jar", "/app/app.jar"]
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8088/api/profiles?page=0&size=1"]

  frontend:
    image: ${IMAGE_BASE:?Set IMAGE_BASE}:${IMAGE_TAG:?Set IMAGE_TAG}-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: /api
    expose:
      - "3000"
    networks:
      - bidmyhobby-network

networks:
  bidmyhobby-network:
    driver: bridge

volumes:
  catalog-data:
  auction-data:
  hobby-ai-data:
  hobby-ai-images:
  caddy-data:
  caddy-config:
