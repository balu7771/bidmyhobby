spring.application.name=auction-service
server.port=8082
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Configuration - Configurable via environment
logging.level.root=${LOG_LEVEL:ERROR}
logging.level.com.bidmyhobby=${LOG_LEVEL:ERROR}
logging.level.org.springframework.cloud=${LOG_LEVEL:ERROR}

# AWS Configuration
aws.region=${AWS_DEFAULT_REGION:ap-south-1}
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:bidmyhobby-s3}
aws.s3.bucket.bids-prefix=bids/
aws.s3.region=${AWS_S3_REGION:ap-south-1}

# OCI S3-compatible Storage Override (for OCI deployment)
# Set AWS_S3_ENDPOINT to: https://bucketname.compat.objectstorage.ap-singapore-1.oraclecloud.com
# aws.s3.endpoint=${AWS_S3_ENDPOINT}

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer