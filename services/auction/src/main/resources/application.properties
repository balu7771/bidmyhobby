spring.application.name=auction-service
auth.token.secret=${AUTH_TOKEN_SECRET:local-development-secret-change-me-123456789}
server.port=8082
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Configuration - Configurable via environment
logging.level.root=${LOG_LEVEL:ERROR}
logging.level.com.bidmyhobby=${LOG_LEVEL:ERROR}
logging.level.com.netflix.eureka=${LOG_LEVEL:ERROR}
logging.level.com.netflix.discovery=${LOG_LEVEL:ERROR}
logging.level.org.springframework.cloud=${LOG_LEVEL:ERROR}

# Eureka Configuration
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka}

# AWS Configuration
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:}
aws.region=ap-south-1
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:bidmyhobby-catalog}
aws.s3.bucket.bids-prefix=bids/

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
