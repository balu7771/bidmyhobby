spring.application.name=auction-service
auth.token.secret=${AUTH_TOKEN_SECRET:local-development-secret-change-me-123456789}
server.port=8082
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging Configuration - Configurable via environment
logging.level.root=${LOG_LEVEL:ERROR}
logging.level.com.bidmyhobby=${LOG_LEVEL:ERROR}
logging.level.org.springframework.cloud=${LOG_LEVEL:ERROR}

# Google Cloud Storage Configuration
gcp.storage.bucket.name=${GCP_STORAGE_BUCKET:${GCS_BUCKET_NAME:}}

# AWS Configuration
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:}
aws.sessionToken=${AWS_SESSION_TOKEN:}
aws.region=${AWS_DEFAULT_REGION:ap-south-1}
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:bidmyhobby-catalog}
aws.s3.bucket.bids-prefix=bids/

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
