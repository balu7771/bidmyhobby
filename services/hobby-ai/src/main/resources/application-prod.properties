spring.application.name=hobby-ai-service

# AWS S3 Configuration
aws.region=${AWS_DEFAULT_REGION:us-east-1}

# H2 Database configuration for production
spring.datasource.url=jdbc:h2:file:/app/data/hobbyai
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update

# Static file storage configuration
app.storage.images-dir=/app/images

# Set to false in production
startup-actions.initializeProfiles=false

# User profile
hobbyai.lookingForGender=Female
hobbyai.character.user={id:'user', firstName:'Balaji', lastName:'Mudipalli', age:41, ethnicity:'Indian', gender:'MALE', bio:'Software engineer, manager and learner. I like drawing and travelling.', imageUrl:'', mainHobby:'Drawing'}

# Swagger/OpenAPI properties
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.org.springframework.data.jpa=INFO
logging.level.com.bidmyhobby=INFO

# Site URL for WhatsApp reply links
app.site.url=${SITE_URL:https://bidmyhobby.com}
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:}
auth.token.secret=${AUTH_TOKEN_SECRET}
auth.admin.emails=${ADMIN_EMAILS:}
auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
whatsapp.enabled=${WHATSAPP_ENABLED:false}


# Server configuration
server.port=8080
