spring.application.name=hobby-ai-service
server.port=8088

# AWS Configuration
aws.region=${AWS_DEFAULT_REGION:ap-south-1}
aws.s3.ai.bucket=${AWS_S3_AI_BUCKET_NAME:bidmyhobby-ai-profiles}
aws.s3.images-prefix=${AWS_S3_AI_IMAGES_PREFIX:}
aws.s3.profiles-key=profiles.json

openai.api.key=${OPENAI_API_KEY:}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/responses}
openai.model=${OPENAI_MODEL:gpt-4o-mini}

# H2 Database configuration
spring.datasource.url=jdbc:h2:file:./data/hobbyai
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update

# Static file storage configuration
app.storage.images-dir=./images

# Startup actions
startup-actions.initializeProfiles=true

# User profile
hobbyai.lookingForGender=Female
hobbyai.character.user={id:'${user.email:user@example.com}', firstName:'${user.firstName:User}', lastName:'${user.lastName:Name}', age:${user.age:30}, ethnicity:'${user.ethnicity:Unknown}', gender:'${user.gender:MALE}', bio:'${user.bio:Tell us about yourself}', imageUrl:'${user.imageUrl:}', mainHobby:'${user.mainHobby:General}'}

# Swagger/OpenAPI properties
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.org.springframework.data.jpa=DEBUG
logging.level.com.bidmyhobby=INFO

# Site URL for WhatsApp reply links (override via env var SITE_URL)
app.site.url=${SITE_URL:http://localhost:3000}

# Passwordless email authentication
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:}
auth.token.secret=${AUTH_TOKEN_SECRET:local-development-secret-change-me-123456789}
auth.admin.emails=${ADMIN_EMAILS:}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
whatsapp.enabled=${WHATSAPP_ENABLED:false}
