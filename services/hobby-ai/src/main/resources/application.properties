spring.application.name=hobby-ai-service
server.port=8088

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# AWS Configuration
aws.region=${AWS_DEFAULT_REGION:ap-south-1}
aws.s3.ai.bucket=${AWS_S3_AI_BUCKET_NAME:bidmyhobby-ai-profiles}
aws.s3.images-prefix=${AWS_S3_AI_IMAGES_PREFIX:}
aws.s3.profiles-key=profiles.json

# AWS Bedrock Knowledge Base
aws.bedrock.knowledge-base-id=${AWS_BEDROCK_KB_ID:}

# AWS Bedrock Model Configuration
aws.bedrock.region=${AWS_BEDROCK_REGION:ap-south-1}
# You can use the short ID (e.g., us.amazon.nova-pro-v1:0) or the full Inference Profile ARN
aws.bedrock.model-id=${AWS_BEDROCK_MODEL_ID:apac.amazon.nova-pro-v1:0}
aws.bedrock.guardrail.id=${AWS_BEDROCK_GUARDRAIL_ID:urjpbiqc03ne}
aws.bedrock.guardrail.version=${AWS_BEDROCK_GUARDRAIL_VERSION:DRAFT}

# H2 Database configuration
spring.datasource.url=jdbc:h2:file:./data/hobbyai
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update

# Static file storage configuration
app.storage.images-dir=./images

# Startup actions
startup-actions.initializeProfiles=true

# User profile
hobbyai.lookingForGender=Female
hobbyai.character.user={id:'${user.email:user@example.com}', firstName:'${user.firstName:User}', lastName:'${user.lastName:Name}', age:${user.age:30}, ethnicity:'${user.ethnicity:Unknown}', gender:'${user.gender:MALE}', bio:'${user.bio:Tell us about yourself}', imageUrl:'${user.imageUrl:}', mainHobby:'${user.mainHobby:General}'}

# Swagger/OpenAPI properties
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.org.springframework.data.jpa=DEBUG
logging.level.com.bidmyhobby=INFO

# Site URL for WhatsApp reply links (override via env var SITE_URL)
app.site.url=${SITE_URL:http://localhost:3000}