# Docker profile configuration
spring.application.name=hobby-ai-service
server.port=8088

# Eureka Configuration for Docker
eureka.client.service-url.defaultZone=http://eureka-discovery:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=hobby-ai-service

# AWS Bedrock Configuration
aws.region=${AWS_DEFAULT_REGION:us-east-1}

# H2 Database configuration
spring.datasource.url=jdbc:h2:file:./data/hobbyai
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update

# Static file storage configuration
app.storage.images-dir=images

# Set to true only when you want to generate profiles
startup-actions.initializeProfiles=true

# User profile
hobbyai.lookingForGender=Female
hobbyai.character.user={id:'user', firstName:'Balaji', lastName:'Mudipalli', age:41, ethnicity:'Indian', gender:'MALE', bio:'Software engineer, manager and learner. I like drawing and travelling.', imageUrl:'', mainHobby:'Drawing'}

# Swagger/OpenAPI properties
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.org.springframework.data.jpa=DEBUG
logging.level.com.bidmyhobby=INFO

# Site URL for WhatsApp magic link replies (override via SITE_URL env var)
app.site.url=${SITE_URL:https://bidmyhobby.com}