# Docker profile configuration
spring.application.name=hobby-ai-service
server.port=8088

# AWS S3 Configuration
aws.region=${AWS_DEFAULT_REGION:us-east-1}

# H2 Database configuration
spring.datasource.url=jdbc:h2:file:./data/hobbyai
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
sendgrid.api.key=${SENDGRID_API_KEY:}
sendgrid.from.email=${SENDGRID_FROM_EMAIL:}
n8n.webhook.url=${N8N_WEBHOOK_URL:}
n8n.webhook.token=${N8N_WEBHOOK_TOKEN:}
smtp.from=${SMTP_FROM:${SMTP_USERNAME:}}
smtp.username=${SMTP_USERNAME:}
smtp.password=${SMTP_PASSWORD:}

# Spring Mail (Gmail SMTP / Standard SMTP)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
auth.token.secret=${AUTH_TOKEN_SECRET:local-development-secret-change-me-123456789}
auth.admin.emails=${ADMIN_EMAILS:}
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
whatsapp.enabled=${WHATSAPP_ENABLED:false}
spring.jpa.hibernate.ddl-auto=update

# Static file storage configuration
app.storage.images-dir=images

# Set to true only when you want to generate profiles
startup-actions.initializeProfiles=true

# User profile
hobbyai.lookingForGender=Female
hobbyai.character.user={id:'user', firstName:'Balaji', lastName:'Mudipalli', age:41, ethnicity:'Indian', gender:'MALE', bio:'Software engineer, manager and learner. I like drawing and travelling.', imageUrl:'', mainHobby:'Drawing'}

# Swagger/OpenAPI properties
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Logging
logging.level.org.springframework.data.jpa=DEBUG
logging.level.com.bidmyhobby=INFO

# Site URL for WhatsApp magic link replies (override via SITE_URL env var)
app.site.url=${SITE_URL:https://bidmyhobby.com}
