worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Docker service containers can receive a new IP whenever they are rebuilt.
    # Re-resolve their names so the gateway never keeps routing to a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream catalog_backend {
        zone catalog_backend 64k;
        server catalog-service:8081 resolve;
    }
    upstream auction_backend {
        zone auction_backend 64k;
        server auction-service:8082 resolve;
    }
    upstream hobby_ai_backend {
        zone hobby_ai_backend 64k;
        server hobby-ai-service:8088 resolve;
    }
    upstream frontend_backend {
        zone frontend_backend 64k;
        server frontend:3000 resolve;
    }

    map $http_origin $cors_origin {
        default "";
        "http://localhost:3000" $http_origin;
        "~^https://([a-z0-9-]+\.)?bidmyhobby\.com$" $http_origin;
    }

    # Allow uploads up to 60 MB (4 × 13 MB files + multipart overhead)
    client_max_body_size 60M;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Global timeout settings for slow mobile networks
    proxy_connect_timeout 30s;   # Allow 30s to connect (slow 3G/4G networks)
    proxy_send_timeout 60s;      # Allow 60s to send request data
    proxy_read_timeout 120s;     # Allow 120s to read response

    server {
        listen       80;
        server_name  localhost;
        proxy_intercept_errors on;

        error_page 502 503 504 = @service_unavailable;
        location @service_unavailable {
            default_type application/json;
            return 503 '{"error":"This service is temporarily unavailable. Please try again in a moment."}';
        }

        # Standard CORS headers for all responses
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;

        # Prevent duplicate CORS headers from backend services
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        proxy_hide_header 'Access-Control-Allow-Credentials';

        # Handle Preflight requests globally
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Machine-readable catalog API documentation.
        location = /api/docs/catalog {
            proxy_pass http://catalog_backend/api/catalog/v3/api-docs;
            proxy_set_header Host $host;
        }

        # Catalog Service (file upload support)
        location /api/catalog {
            proxy_pass http://catalog_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Extended timeouts for file uploads on slow networks
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Auction Service
        location /api/auction {
            proxy_pass http://auction_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # Hobby AI Service - WhatsApp endpoints (OTP polling, mobile auth)
        location /api/auth {
            proxy_pass http://hobby_ai_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # Hobby AI Service - WhatsApp endpoints (optional notification channel)
        location /api/ai/whatsapp {
            proxy_pass http://hobby_ai_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Generous timeouts for OTP delivery/verification polling
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }

        # Hobby AI Service - AI Search endpoints
        location /api/ai-search {
            proxy_pass http://hobby_ai_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # AI operations can take longer
            proxy_connect_timeout 30s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # Hobby AI Service - Profiles and other AI endpoints
        location /api/ai {
            proxy_pass http://hobby_ai_backend/api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 120s;
        }

        # Frontend Service (Root)
        location / {
            proxy_pass http://frontend_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }
    }
}
