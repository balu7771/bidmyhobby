# AI Moderation Service Configuration (now using Lambda)
# ai.moderation.lambda.url=http://localhost:5001/moderate

# Spring Boot Configuration
spring.application.name=catalog-service
auth.token.secret=${AUTH_TOKEN_SECRET:local-development-secret-change-me-123456789}
server.port=8081

# Ensure static resource handling doesn't override MVC controller routes
spring.web.resources.add-mappings=true


# HTTPS Configuration for mobile compatibility
server.ssl.enabled=false
server.forward-headers-strategy=framework

# File Upload Configuration for mobile
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=60MB

# Logging Configuration - Configurable via environment
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.bidmyhobby=${LOG_LEVEL:INFO}
logging.level.com.netflix.eureka=${LOG_LEVEL:INFO}
logging.level.com.netflix.discovery=${LOG_LEVEL:INFO}
logging.level.org.springframework.cloud=${LOG_LEVEL:INFO}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Eureka Configuration (default to local)
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Notification Service Configuration
notification.service.url=http://localhost:8086/api/notifications

# AWS Configuration
aws.accessKeyId=${AWS_ACCESS_KEY_ID:}
aws.secretKey=${AWS_SECRET_ACCESS_KEY:}
aws.region=${AWS_DEFAULT_REGION:ap-south-1}
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:bidmyhobby-catalog}
aws.s3.bucket.metadata-prefix=${AWS_S3_METADATA_PREFIX:metadata/}
aws.s3.bucket.images-prefix=${AWS_S3_IMAGES_PREFIX:images/}
aws.lambda.function.image-processor=${AWS_LAMBDA_IMAGE_PROCESSOR:bidmyhobby-image-processor}
aws.lambda.function.ai-moderation=${AWS_LAMBDA_AI_MODERATION:bidmyhobby-ai-moderation}

# OpenAI powers hobby classification and draft generation. Never commit the key.
openai.api.key=${OPENAI_API_KEY:}
openai.api.url=${OPENAI_API_URL:https://api.openai.com/v1/responses}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.timeout-seconds=${OPENAI_TIMEOUT_SECONDS:30}

# Local/MVP draft persistence. Override with PostgreSQL settings in production.
spring.datasource.url=${CATALOG_DATASOURCE_URL:jdbc:h2:file:./data/catalog}
spring.datasource.driverClassName=${CATALOG_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${CATALOG_DATASOURCE_USERNAME:sa}
spring.datasource.password=${CATALOG_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

springdoc.api-docs.path=/api/catalog/v3/api-docs
springdoc.swagger-ui.path=/api/catalog/swagger-ui.html
