x-business-common: &business-common
  pull_policy: never
  environment:
    - SPRING_PROFILES_ACTIVE=docker
    - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
    - EUREKA_CLIENT_FETCH_REGISTRY=false
    - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-dummy-bucket}
    - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-dummy-access-key}
    - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-dummy-secret-key}
    - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
    - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET}
    - CATALOG_SERVICE_URL=${CATALOG_SERVICE_URL:-http://catalog-service:8081}
  networks:
    - bidmyhobby-network

# Reusable health check for Spring Boot actuator
x-springboot-healthcheck: &springboot-healthcheck
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 180s   # Allow up to 3 min for slow OCI/emulated startups

services:
  api-gateway:
    image: nginx:alpine
    pull_policy: never
    ports:
      - "80:80"
    volumes:
      - ./services/api-gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - bidmyhobby-network
    depends_on:
      catalog-service:
        condition: service_healthy
      auction-service:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped

  catalog-service:
    <<: *business-common
    image: bidmyhobby-v2-catalog-service:latest
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-dummy-bucket}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-dummy-access-key}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-dummy-secret-key}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-south-1}
      - AWS_LAMBDA_IMAGE_PROCESSOR=${AWS_LAMBDA_IMAGE_PROCESSOR:-bidmyhobby-image-processor}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET}
    ports:
      - "8081:8081"
    # Speed up JVM startup; -XX:TieredStopAtLevel=1 disables full JIT on boot
    entrypoint: ["java", "-XX:TieredStopAtLevel=1", "-jar", "app.jar"]
    healthcheck:
      <<: *springboot-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
    restart: unless-stopped

  auction-service:
    <<: *business-common
    image: bidmyhobby-v2-auction-service:latest
    ports:
      - "8082:8082"
    entrypoint: ["java", "-XX:TieredStopAtLevel=1", "-jar", "app.jar"]
    healthcheck:
      <<: *springboot-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
    restart: unless-stopped

  hobby-ai-service:
    <<: *business-common
    image: bidmyhobby-v2-hobby-ai-service:latest
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
      - AWS_S3_BUCKET_NAME=${AWS_S3_BUCKET_NAME:-dummy-bucket}
      - AWS_S3_AI_BUCKET_NAME=bidmyhobby-ai-profiles
      - AWS_S3_AI_IMAGES_PREFIX=images/
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-dummy-access-key}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-dummy-secret-key}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-ap-south-1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER:-+14155238886}
      - SITE_URL=${SITE_URL:-https://bidmyhobby.com}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY:-}
      - SENDGRID_FROM_EMAIL=${SENDGRID_FROM_EMAIL:-}
      - AUTH_TOKEN_SECRET=${AUTH_TOKEN_SECRET}
      - ADMIN_EMAILS=${ADMIN_EMAILS:-}
      - APP_SITE_URL=${APP_SITE_URL:-https://bidmyhobby.com}
      - AUTH_COOKIE_SECURE=true
    ports:
      - "8088:8088"
    entrypoint: ["java", "-XX:TieredStopAtLevel=1", "-jar", "/app/app.jar"]
    healthcheck:
      <<: *springboot-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8088/actuator/health"]
    restart: unless-stopped

  frontend:
    image: bidmyhobby-v2-frontend:latest
    pull_policy: never
    environment:
      - NEXT_PUBLIC_API_URL=/api
    ports:
      - "3000:3000"
    depends_on:
      - catalog-service
    networks:
      - bidmyhobby-network
    restart: unless-stopped

networks:
  bidmyhobby-network:
    driver: bridge
